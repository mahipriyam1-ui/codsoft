<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (transparent) -->
  <rect width="500" height="500" fill="transparent"/>
  
  <!-- Left geometric square for M -->
  <rect x="80" y="140" width="140" height="220" fill="#1e3a5f" rx="8"/>
  <rect x="90" y="150" width="120" height="200" fill="none" stroke="#f39c12" stroke-width="4" rx="6"/>
  
  <!-- M letter inside -->
  <text x="150" y="295" text-anchor="middle" style="font-family: 'Arial', sans-serif; font-size: 120px; font-weight: 700; fill: #f39c12;">M</text>
  
  <!-- Right circle for P -->
  <circle cx="360" cy="250" r="90" fill="#4a90e2"/>
  <circle cx="360" cy="250" r="85" fill="none" stroke="#f39c12" stroke-width="3"/>
  
  <!-- P letter inside circle -->
  <text x="360" y="280" text-anchor="middle" style="font-family: 'Arial', sans-serif; font-size: 100px; font-weight: 700; fill: white;">P</text>
  
  <!-- Bottom accent line -->
  <line x1="100" y1="400" x2="400" y2="400" stroke="#f39c12" stroke-width="6" stroke-linecap="round"/>
</svg>
